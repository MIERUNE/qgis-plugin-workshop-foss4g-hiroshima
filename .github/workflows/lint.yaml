name: Lint

on:
  pull_request:
    paths-ignore:
      - "*.md"
  workflow_dispatch:

jobs:
  Test:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install the project
        run: uv sync --all-extras --dev
