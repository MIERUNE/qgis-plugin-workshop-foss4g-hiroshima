name: Test plugin

on:
  pull_request:
    paths-ignore:
      - "*.md"
  workflow_dispatch:

env:
  DOCKER_IMAGE: qgis/qgis

jobs:
  Test-plugin:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        docker_tags: ["3.40", "4.0-trixie"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Docker pull QGIS
        run: |
          docker pull "$DOCKER_IMAGE":${{ matrix.docker_tags }}

      - name: Run tests and type check
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/plugin \
            -w /plugin \
            "$DOCKER_IMAGE":${{ matrix.docker_tags }} \
            sh -c "
              pip3 install --break-system-packages pytest pytest-qgis pyright &&
              xvfb-run -s '+extension GLX -screen 0 1024x768x24' \
                python3 -m pytest tests/ -v &&
              python3 -m pyright --pythonpath /usr/bin/python3
            "
